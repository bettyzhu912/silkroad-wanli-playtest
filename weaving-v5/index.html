<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1d130c">
<title>于阗织坊 · 试玩（FINAL v5.0 · modal）</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="weaving.css?v=2f0d62e3dd">
</head>
<body>
<div id="host" class="host" aria-hidden="true">
  <img class="host-bg" src="art/modal/host_khotan_bg.webp" alt="" draggable="false">
  <div class="host-mask"></div>
  <div class="host-note">独立试玩 · 背景为模拟的主游戏场景（未接入主游戏）</div>
</div>
<div id="app" class="app">
  <div id="modal" class="modal" aria-label="于阗织坊">
    <div id="hud" class="hud">
      <div class="hud-title">于阗织坊</div>
      <div class="hud-mid"><span id="hud-count" class="hud-count">已理丝线 <b>0</b>/5</span><span class="hud-sep">｜</span><span class="hud-time">日影 <span class="hud-bar"><i id="hud-fill"></i><em id="hud-sun"></em></span> 余 <b id="hud-secs">75</b></span></div>
      <button id="pause" class="hud-pause" type="button" aria-label="暂停">▮▮</button>
    </div>
    <div id="stage" class="stage">
      <img id="bg" class="bg" alt="" draggable="false">
      <div id="layer" class="layer"></div>
      <svg id="lines" class="lines" viewBox="0 0 700 1091" aria-hidden="true"></svg>
      <div id="chips" class="chips"></div>
    </div>
    <div id="overlay" class="overlay" hidden></div>
  </div>
</div>
<div id="rotate" class="rotate" hidden>请竖屏使用</div>
<script src="art/modal/layout.js?v=2f0d62e3dd"></script>
<script src="weaving-engine.js?v=2f0d62e3dd"></script>
<script src="weaving-ui.js?v=2f0d62e3dd"></script>
</body>
</html>
